name: Crear APK de ATLAS

on:
  workflow_dispatch:
  push:
    paths:
      - 'ATLAS_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: unzip ATLAS_Android_Project.zip

      - name: Compilar aplicación
        run: gradle -p ATLAS_Android_Project assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-APK
          path: ATLAS_Android_Project/app/build/outputs/apk/debug/app-debug.apk
